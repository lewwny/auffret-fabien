<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121d30" />
      <stop offset="1" stop-color="#0a1220" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e2e8f1" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="1080" cy="120" r="220" fill="#f5a809" fill-opacity="0.12" />
  <circle cx="120" cy="560" r="200" fill="#fbbf24" fill-opacity="0.08" />

  <!-- Logo -->
  <g transform="translate(90 88)">
    <rect width="84" height="84" rx="20" fill="#fbbf24" />
    <path d="M48 16 26 50h15l-4 26 24-38H46l6-22z" fill="#0a1220" />
  </g>

  <text x="196" y="124" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Fabien Auffret</text>
  <text x="196" y="160" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#fcd34d">ÉLECTRICIEN</text>

  <!-- Titre principal -->
  <text x="90" y="320" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff">Électricien de confiance</text>
  <text x="90" y="410" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800" fill="#fbbf24">à Châtillon-sur-Loire</text>

  <!-- Pied -->
